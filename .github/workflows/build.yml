name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -o *.zip -d project
          echo "=== Structure du projet ==="
          find project -maxdepth 3 -type d
          echo "=== Fichiers Gradle trouvés ==="
          find project -name "settings.gradle*" -o -name "build.gradle*" | head -20

      - name: Locate project root
        id: findroot
        run: |
          ROOT=$(find project -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ Aucun settings.gradle trouvé dans le ZIP"
            echo "Contenu complet du ZIP :"
            find project -type f | head -50
            exit 1
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✅ Racine du projet : $ROOT"

      - name: Grant gradlew permission
        working-directory: ${{ steps.findroot.outputs.root }}
        run: chmod +x gradlew || echo "Pas de gradlew — sera géré par Gradle"

      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.root }}
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew manquant, installation du wrapper"
            gradle wrapper --gradle-version 8.5
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: locate
        run: |
          APK=$(find project -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ Aucun APK généré"
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "✅ APK trouvé : $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMaster-APK
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error
